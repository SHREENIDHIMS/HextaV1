# One server block per project. Add a new file here for each additional
# project — do not add more nginx containers.
#
# This proxies to 172.20.0.1:18001, which is owned by a systemd SOCKET
# unit on the host (see infra/systemd/hexa-backend.socket). The backend
# binds that docker-bridge gateway address only, so the ONLY way to reach
# it is from a container on shared_net — nothing external can connect.
# The app process behind it only starts on the first real connection and
# is stopped again after an idle period by the watcher timer — this
# nginx config doesn't need to know that; it just proxies as normal.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Security headers (Phase 2). `always` keeps them on 4xx/5xx too.
    # script-src/style-src allow 'unsafe-inline' because the Next.js
    # static export embeds an inline hydration bootstrap; revisit with
    # a nonce/hash if the export ever emits external-only scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Static frontend export (Next.js `output: 'export'`), mounted
    # read-only from the host into /var/www/hexa (see docker-compose).
    root /var/www/hexa;
    index index.html;

    location /health {
        proxy_pass http://172.20.0.1:18001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://172.20.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # First request after idle-stop will be slow (cold start) —
        # give it room instead of timing out.
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
