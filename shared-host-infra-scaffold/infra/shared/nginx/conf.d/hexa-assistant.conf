# One server block per project. Add a new file here for each additional
# project — do not add more nginx containers.
#
# This proxies to 172.20.0.1:18001, which is owned by a systemd SOCKET
# unit on the host (see infra/systemd/hexa-backend.socket). The backend
# binds that docker-bridge gateway address only, so the ONLY way to reach
# it is from a container on shared_net — nothing external can connect.
# The app process behind it only starts on the first real connection and
# is stopped again after an idle period by the watcher timer — this
# nginx config doesn't need to know that; it just proxies as normal.
#
# Rate-limit zones live at http level; this file is included inside the
# http block by nginx's main conf, so defining the zone here is valid.

# Protects the 1 GiB box from a burst of concurrent requests hitting the
# cold-start window all at once (V3.3 §1 rate limiting). 10r/s per IP is
# generous for a small mortgage CRM but floors a flood.
limit_req_zone $binary_remote_addr zone=hexa_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hexa_health:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Security headers (Phase 2). `always` keeps them on 4xx/5xx too.
    # script-src/style-src allow 'unsafe-inline' because the Next.js
    # static export embeds an inline hydration bootstrap; revisit with
    # a nonce/hash if the export ever emits external-only scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Static frontend export (Next.js `output: 'export'`), mounted
    # read-only from the host into /var/www/hexa (see docker-compose).
    root /var/www/hexa;
    index index.html;

    # Match backend/settings.max_upload_bytes (20MB) — an unbounded body
    # on the document upload endpoint is a straightforward DoS vector on
    # a 1 GiB box (V3.3 §1 request size limits).
    client_max_body_size 20m;

    location /health {
        limit_req zone=hexa_health burst=20 nodelay;
        proxy_pass http://172.20.0.1:18001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Burst lets the SPA's parallel hydration requests through without
        # immediately shedding 429s, while still capping sustained flood.
        limit_req zone=hexa_api burst=20 nodelay;
        proxy_pass http://172.20.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # First request after idle-stop will be slow (cold start) —
        # give it room instead of timing out.
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
