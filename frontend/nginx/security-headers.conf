# Security headers applied by the standalone frontend nginx.
# Included at server level AND inside static locations that set their own
# Cache-Control headers (nginx `add_header` inheritance: a location with
# any add_header drops all inherited ones, so each such location must
# re-include this snippet).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:18001 http://127.0.0.1:18001; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
