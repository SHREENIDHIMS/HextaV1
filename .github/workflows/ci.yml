name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm run lint

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      # Unit tests intentionally run WITHOUT a live Postgres — the suite
      # mocks app.db.postgres.session.acquire (see tests/unit/conftest.py).
      - name: Run unit tests
        env:
          HEXA_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          HEXA_ENVIRONMENT: development
        run: |
          cd backend
          python -m pytest tests/unit/ -v --timeout=60

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run evaluation benchmark
        run: |
          python -m evaluation.run_benchmark --output-dir evaluation/reports
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: evaluation/reports/
