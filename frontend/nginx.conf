worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        server_tokens off;
        absolute_redirect off;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers (Phase 2) — see nginx/security-headers.conf.
        include /etc/nginx/conf.d/security-headers.conf;

        # Static assets - cache aggressively
        location /_next/static/ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, immutable, max-age=31536000";
            try_files $uri =404;
        }

        # Static files (images, txt, etc)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|txt|woff|woff2|ttf|eot|pdf|json)$ {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # SPA routing - try the file, then the directory index, then fall back to index.html
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
